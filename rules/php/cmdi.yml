rules:
  - id: php.cmdi.user-input-to-shell
    mode: taint
    message: >
      User-controlled input reaches a shell command. Avoid shelling out with
      user input; if unavoidable, allowlist values and use escapeshellarg()
      / escapeshellcmd().
    languages: [php]
    severity: ERROR
    metadata:
      vuln_class: cmdi
      cwe: "CWE-78: OS Command Injection"
      owasp: A03:2021 - Injection
      confidence: HIGH
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
      - pattern: $_SERVER['QUERY_STRING']
      - pattern: $_SERVER['HTTP_USER_AGENT']
    pattern-sinks:
      - pattern-either:
          - pattern: system(...)
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: passthru(...)
          - pattern: popen(...)
          - pattern: proc_open(...)
          - pattern: pcntl_exec(...)
          - pattern: '`...`'
    pattern-sanitizers:
      - pattern: intval(...)
      - pattern: (int) $X
      - pattern: escapeshellarg(...)
      - pattern: escapeshellcmd(...)
      - pattern: basename(...)
